<!doctype html>
<html lang="es">
<head>
  <base href="/invitacion/xv-ximena/">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:," />
<title>Invitación XV Años — Ximena</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Great+Vibes&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy-950:#081426; --navy-900:#0b1d38; --navy-800:#10294f; --navy-700:#1d3f7a; --navy-500:#3d63a5;
    --blue-soft:#7fa6d9; --blue-pale:#bcd2ef;
    --gold:#c9a86a; --gold-light:#e9d193; --gold-deep:#9a7c3f;
    --paper:#f8f1de; --paper-2:#f3e9d2; --ink:#22355c; --ink-soft:#4a5b82;
    --serif:"Cormorant Garamond", Georgia, serif;
    --script:"Great Vibes", cursive;
    --sans:"Jost", system-ui, sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; font-family:var(--sans); color:#eef2fb; overflow-x:hidden;
    background:
      radial-gradient(1.5px 1.5px at 12% 22%, rgba(233,209,147,.55) 50%, transparent 51%),
      radial-gradient(1px 1px at 84% 14%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 68% 38%, rgba(233,209,147,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 28% 66%, rgba(255,255,255,.35) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 92% 58%, rgba(188,210,239,.45) 50%, transparent 51%),
      radial-gradient(1px 1px at 45% 88%, rgba(233,209,147,.4) 50%, transparent 51%),
      radial-gradient(120% 90% at 50% 0%, #16305c 0%, var(--navy-900) 46%, var(--navy-950) 100%);
    background-color:var(--navy-950);
  }
  button{ font-family:inherit; }
  button, [role="button"]{ min-height:2.75rem; }

  /* ---------- App frame ---------- */
  .app{ width:100%; height:100vh; height:100dvh; margin:0 auto; display:flex; flex-direction:column; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); position:relative; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; min-height:44px; width:100%; max-width:820px; margin:0 auto; flex:none; }
  .topbar .brand{ font-family:var(--serif); font-style:italic; font-size:1.02rem; letter-spacing:.04em; color:var(--blue-pale); }
  .music-btn{
    width:44px; height:44px; border-radius:50%; border:1px solid rgba(201,168,106,.55);
    background:rgba(16,41,79,.65); color:var(--gold-light); display:grid; place-items:center; cursor:pointer;
  }
  .music-btn svg{ width:20px; height:20px; }
  .music-btn.playing{ background:var(--gold); color:var(--navy-900); border-color:var(--gold-light); }
  .music-btn .note-off{ display:none; }
  .music-btn.playing .note-on{ display:none; }
  .music-btn.playing .note-off{ display:block; }

  /* ---------- Book stage ---------- */
  .stage-wrap{ flex:1; min-height:0; display:flex; padding:6px 0 2px; }
  .stage{
    position:relative; margin:auto; height:100%; max-height:100%; max-width:100%;
    aspect-ratio: 3 / 4.05;
    perspective:1900px; perspective-origin:12% 45%;
    touch-action: pan-y; user-select:none; -webkit-user-select:none;
  }
  /* the page waiting underneath */
  .page-under{
    position:absolute; inset:0; border-radius:6px 14px 14px 6px; overflow:hidden;
    box-shadow:0 24px 50px rgba(0,0,0,.55), 0 4px 14px rgba(0,0,0,.4);
    transform:scale(.992); background:var(--paper);
  }
  .page-under .veil{ position:absolute; inset:0; background:#0a1830; opacity:0; pointer-events:none; z-index:5; }
  /* soft shadow the turning sheet casts on the page underneath:
     a band that sweeps in from the right edge toward the spine */
  .sheet-shadow{
    position:absolute; top:1.5%; bottom:-1.5%; left:0; width:100%; border-radius:14px;
    background:linear-gradient(to left, rgba(2,6,16,.6), rgba(2,6,16,.22) 55%, transparent 85%);
    filter:blur(14px); opacity:0; pointer-events:none; z-index:1;
    transform-origin:left center; will-change:transform,opacity;
  }
  .page-under{ z-index:2; }
  /* the turning sheet: hinged on the spine, the LEFT edge, like a real leaf.
     It lifts from the right corner, stands on the spine at mid-turn and
     falls over to the left side of the book. */
  .sheet{
    position:absolute; inset:0; z-index:3;
    transform-origin:0% 50%; -webkit-transform-origin:0% 50%;
    transform-style:preserve-3d; will-change:transform;
  }
  .face{
    position:absolute; inset:0; border-radius:6px 14px 14px 6px; overflow:hidden;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    background:var(--paper);
  }
  .face.back{ transform:rotateY(180deg); border-radius:14px 6px 6px 14px; }
  /* spine shading + turning shades */
  .spine{ position:absolute; top:0; bottom:0; width:34px; pointer-events:none; z-index:6; }
  .face.front .spine{ left:0; background:linear-gradient(to right, rgba(70,50,15,.20), rgba(70,50,15,.05) 55%, transparent); }
  .face.back .spine{ right:0; background:linear-gradient(to left, rgba(70,50,15,.20), rgba(70,50,15,.05) 55%, transparent); }
  .shade{ position:absolute; inset:0; pointer-events:none; opacity:0; z-index:7; }
  .shade-front{ background:linear-gradient(to left, rgba(24,32,58,.5), rgba(24,32,58,.12) 45%, transparent 72%); }
  .shade-back{ background:linear-gradient(to right, rgba(24,32,58,.5), rgba(24,32,58,.12) 45%, transparent 72%); }
  .curl{
    position:absolute; inset:0; pointer-events:none; opacity:0; z-index:8; mix-blend-mode:soft-light;
    background:linear-gradient(100deg, transparent 22%, rgba(255,255,255,.95) 48%, rgba(60,70,110,.55) 62%, transparent 82%);
    background-size:260% 100%; background-position:110% 0;
  }
  /* corner fold hints */
  .corner{
    position:absolute; width:86px; height:86px; z-index:9; pointer-events:none; opacity:0; transition:opacity .4s;
  }
  .corner.show{ opacity:1; }
  .corner .fold{
    position:absolute; width:44px; height:44px;
    background:linear-gradient(315deg, transparent 49%, rgba(160,130,70,.28) 50%, #fff8e9 62%, #e9dcbc 100%);
    box-shadow:-2px -2px 5px rgba(60,45,10,.18);
  }
  .corner-r{ right:0; bottom:0; }
  .corner-r .fold{ right:0; bottom:0; border-radius:12px 0 12px 0; animation:foldPulse 2.2s ease-in-out infinite; transform-origin:bottom right; }
  .corner-l{ left:0; bottom:0; }
  .corner-l .fold{ left:0; bottom:0; border-radius:0 12px 0 12px; transform:scaleX(-1); animation:foldPulse 2.2s ease-in-out infinite; transform-origin:bottom left; }
  .corner .lbl{
    position:absolute; bottom:52px; font-size:.62rem; letter-spacing:.14em; text-transform:uppercase;
    font-weight:600; white-space:nowrap;
    background:rgba(8,20,38,.82); color:var(--gold-light); padding:5px 9px; border-radius:999px;
    border:1px solid rgba(201,168,106,.45);
  }
  .corner-r .lbl{ right:10px; }
  .corner-l .lbl{ left:10px; }
  @keyframes foldPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.14);} }
  .corner-l .fold{ animation-name:foldPulseL; }
  @keyframes foldPulseL{ 0%,100%{ transform:scaleX(-1) scale(1);} 50%{ transform:scaleX(-1) scale(1.14);} }

  /* ---------- Page content (paper) ---------- */
  .page{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:28px 26px 58px; color:var(--ink);
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(255,255,255,.75), transparent 60%),
      repeating-linear-gradient(0deg, rgba(120,95,40,.025) 0 2px, transparent 2px 5px),
      linear-gradient(160deg, #fdf8ea 0%, var(--paper) 55%, var(--paper-2) 100%);
  }
  .page .frame{
    position:absolute; inset:11px; border:1px solid rgba(154,124,63,.55); border-radius:4px 10px 10px 4px; pointer-events:none;
  }
  .face.back .page .frame{ border-radius:10px 4px 4px 10px; }
  .page .frame::after{ content:""; position:absolute; inset:4px; border:1px solid rgba(154,124,63,.28); border-radius:inherit; }
  .floral{ position:absolute; width:86px; height:86px; pointer-events:none; opacity:.95; z-index:1; }
  .floral.tl{ top:2px; left:2px; }
  .floral.tr{ top:2px; right:2px; transform:scaleX(-1); }
  .floral.bl{ bottom:2px; left:2px; transform:scaleY(-1); }
  .floral.br{ bottom:2px; right:2px; transform:scale(-1); }
  .page > *{ position:relative; z-index:2; }
  .page > .floral{ position:absolute; z-index:1; }
  .page > .frame{ position:absolute; }
  .kicker{ font-size:.66rem; letter-spacing:.34em; text-transform:uppercase; color:var(--gold-deep); font-weight:600; margin:0 0 10px; }
  .icon-lg{ width:52px; height:52px; color:var(--navy-700); margin-bottom:8px; }
  .icon-lg svg{ width:100%; height:100%; }
  .script{ font-family:var(--script); font-weight:400; color:var(--navy-800); line-height:1.05; margin:0; }
  .h-script{ font-size:clamp(2.3rem, 11vw, 3.1rem); }
  .rule{ width:118px; height:14px; margin:10px auto; color:var(--gold); }
  .rule svg{ width:100%; height:100%; }
  .body-txt{ font-family:var(--serif); font-size:1.14rem; line-height:1.45; color:var(--ink-soft); margin:0; }
  .big-date{ font-family:var(--serif); font-weight:700; font-size:clamp(2.5rem,12vw,3.4rem); line-height:1; color:var(--navy-800); margin:2px 0; }
  .names{ font-family:var(--serif); font-weight:600; font-size:clamp(1.35rem,6vw,1.7rem); line-height:1.3; color:var(--navy-800); }
  .amp{ font-family:var(--script); font-size:1.9rem; color:var(--gold-deep); display:block; line-height:1.1; }
  .quote{ font-family:var(--serif); font-style:italic; font-weight:600; font-size:clamp(1.3rem,6.2vw,1.62rem); line-height:1.4; color:var(--navy-800); margin:0; }
  .place{ font-family:var(--serif); font-weight:600; font-size:clamp(1.28rem,6vw,1.6rem); line-height:1.3; color:var(--navy-800); margin:0; }
  .time-big{ font-family:var(--serif); font-weight:700; font-size:2rem; color:var(--gold-deep); margin:8px 0 2px; }
  .btn{
    display:inline-flex; align-items:center; gap:9px; margin-top:16px; padding:12px 22px; min-height:48px;
    border-radius:999px; border:1px solid var(--gold-deep); background:var(--navy-800); color:#fdf6df;
    font-family:var(--sans); font-size:.86rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
    text-decoration:none; cursor:pointer; box-shadow:0 8px 18px rgba(11,29,56,.28);
  }
  .btn svg{ width:17px; height:17px; flex:none; }
  .btn.ghost{ background:transparent; color:var(--navy-800); box-shadow:none; }
  .btn.on-dark{ background:var(--gold); color:var(--navy-900); border-color:var(--gold-light); box-shadow:0 8px 18px rgba(0,0,0,.35); }
  .btn:active{ transform:scale(.97); }

  /* countdown */
  .countdown{ display:flex; gap:8px; margin-top:18px; }
  .cd-cell{ width:62px; padding:9px 0 7px; border:1px solid rgba(154,124,63,.5); border-radius:10px; background:rgba(255,255,255,.5); }
  .cd-num{ font-family:var(--serif); font-weight:700; font-size:1.5rem; line-height:1; color:var(--navy-800); display:block; }
  .cd-lbl{ font-size:.58rem; letter-spacing:.18em; text-transform:uppercase; color:var(--gold-deep); font-weight:600; }

  /* cronograma */
  .timeline{ width:100%; max-width:290px; margin-top:8px; text-align:left; }
  .tl-row{ display:flex; align-items:center; gap:13px; padding:8px 2px; border-bottom:1px dashed rgba(154,124,63,.4); }
  .tl-row:last-child{ border-bottom:none; }
  .tl-ico{ width:38px; height:38px; flex:none; border-radius:50%; border:1px solid rgba(154,124,63,.55); display:grid; place-items:center; color:var(--navy-700); background:rgba(255,255,255,.55); }
  .tl-ico svg{ width:19px; height:19px; }
  .tl-time{ font-family:var(--serif); font-weight:700; font-size:1.06rem; color:var(--gold-deep); width:74px; flex:none; }
  .tl-what{ font-family:var(--serif); font-weight:600; font-size:1.12rem; color:var(--navy-800); }

  /* ---------- Cover page (dark blue) ---------- */
  .page.cover{
    color:#f3e9cd; justify-content:center;
    background:
      radial-gradient(90% 55% at 50% 30%, rgba(61,99,165,.55), transparent 65%),
      repeating-linear-gradient(115deg, rgba(233,209,147,.03) 0 2px, transparent 2px 7px),
      linear-gradient(165deg, #1a3565 0%, var(--navy-800) 48%, #0a1c3a 100%);
  }
  .page.cover .frame{ border-color:rgba(233,209,147,.65); }
  .page.cover .frame::after{ border-color:rgba(233,209,147,.3); }
  .cover-crown{ width:64px; color:var(--gold-light); margin-bottom:2px; }
  .cover-mis{ font-family:var(--serif); letter-spacing:.42em; text-transform:uppercase; font-size:.95rem; color:var(--blue-pale); margin:10px 0 0; text-indent:.42em; }
  .cover-xv{ font-family:var(--serif); font-weight:700; font-size:2rem; letter-spacing:.18em; color:#fdf3d0; margin:2px 0 0; text-indent:.18em; }
  .cover-name{ font-family:var(--script); font-size:clamp(3.4rem,17vw,4.6rem); color:#fdf6dc; line-height:1.1; margin:0; text-shadow:0 3px 22px rgba(233,209,147,.35); }
  .cover-date{ font-family:var(--serif); letter-spacing:.3em; font-size:1rem; color:var(--gold-light); margin-top:12px; text-indent:.3em; }
  .cover-butterfly{ width:40px; color:var(--gold-light); margin-top:14px; opacity:.9; }
  .cover-song{ margin-top:16px; font-size:.66rem; letter-spacing:.22em; text-transform:uppercase; color:rgba(188,210,239,.75); }

  /* ---------- Controls ---------- */
  .controls{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding-top:10px; width:100%; max-width:560px; margin:0 auto; flex:none; }
  .nav-btn{
    width:52px; height:52px; flex:none; border-radius:50%; cursor:pointer;
    border:1px solid rgba(201,168,106,.6); background:rgba(16,41,79,.7); color:var(--gold-light);
    display:grid; place-items:center; transition:opacity .25s, transform .15s;
  }
  .nav-btn svg{ width:22px; height:22px; }
  .nav-btn:active{ transform:scale(.93); }
  .nav-btn:disabled{ opacity:.28; cursor:default; }
  .page-info{ text-align:center; flex:1; }
  .page-info .pnum{ font-family:var(--serif); font-style:italic; font-size:1rem; color:var(--blue-pale); display:block; }
  .progress{ height:3px; border-radius:99px; background:rgba(188,210,239,.18); margin-top:7px; overflow:hidden; }
  .progress i{ display:block; height:100%; width:0%; background:linear-gradient(to right, var(--gold-deep), var(--gold-light)); border-radius:99px; transition:width .5s ease; }
  .hint-line{ text-align:center; font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; color:rgba(188,210,239,.6); margin:10px 0 0; }

  /* ---------- Loader ---------- */
  .loader{
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    background:radial-gradient(110% 80% at 50% 20%, #16305c 0%, var(--navy-900) 55%, var(--navy-950) 100%);
    transition:opacity .7s ease, visibility .7s;
  }
  .loader.done{ opacity:0; visibility:hidden; }
  .loader .crown{ width:58px; color:var(--gold-light); }
  .loader .xv{ font-family:var(--serif); font-weight:700; font-size:3.4rem; letter-spacing:.14em; color:#fdf3d0; line-height:1; margin:4px 0 0; text-indent:.14em; }
  .loader .bar{ width:170px; height:5px; border-radius:99px; border:1px solid rgba(233,209,147,.5); margin-top:20px; overflow:hidden; }
  .loader .bar i{ display:block; height:100%; width:0; background:linear-gradient(to right, var(--gold-deep), var(--gold-light)); animation:load 1.35s ease forwards; }
  @keyframes load{ to{ width:100%; } }
  .loader p{ font-family:var(--serif); font-style:italic; font-size:1.1rem; color:var(--blue-pale); margin:12px 0 0; }

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%, 20px); z-index:60; opacity:0; pointer-events:none;
    background:#fdf6dc; color:var(--navy-900); font-size:.85rem; font-weight:600; padding:11px 18px; border-radius:999px;
    box-shadow:0 12px 30px rgba(0,0,0,.45); transition:all .35s ease; max-width:88vw; text-align:center;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  /* ---------- Closed book ("Toca para abrir") ---------- */
  .closed-book{
    position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px;
    padding:20px; cursor:pointer;
    background:radial-gradient(110% 80% at 50% 20%, #16305c 0%, var(--navy-900) 55%, var(--navy-950) 100%);
    transition:opacity .6s ease, visibility .6s;
  }
  .closed-book.gone{ opacity:0; visibility:hidden; pointer-events:none; }
  .cb-scene{ position:relative; }
  .cb-glow{
    position:absolute; inset:-16% -22%; pointer-events:none; opacity:0; transition:opacity 1.1s ease .25s;
    background:radial-gradient(45% 55% at 32% 50%, rgba(233,209,147,.55), rgba(233,209,147,.12) 55%, transparent 75%);
  }
  .closed-book.opening .cb-glow{ opacity:1; }
  .cb-book{ position:relative; width:min(76vw, 320px); aspect-ratio:3 / 4.05; perspective:1500px; }
  .cb-back{
    position:absolute; inset:0; border-radius:6px 14px 14px 6px;
    background:linear-gradient(165deg, #1a3565 0%, var(--navy-800) 48%, #0a1c3a 100%);
    box-shadow:26px 34px 60px rgba(0,0,0,.6);
  }
  .cb-edge{
    position:absolute; top:5px; bottom:5px; right:-7px; width:7px; border-radius:0 3px 3px 0;
    background:repeating-linear-gradient(to right, #f6edd6 0 2px, #d8c9a4 2px 3px);
  }
  .cb-leaf{
    position:absolute; top:5px; bottom:5px; left:4px; right:2px; border-radius:4px 10px 10px 4px;
    background:linear-gradient(160deg, #fdf8ea 0%, var(--paper) 55%, var(--paper-2) 100%);
    box-shadow:inset -8px 0 14px rgba(120,95,40,.18), inset 6px 0 10px rgba(120,95,40,.12);
    transform-origin:0% 50%; transition:transform 1.45s cubic-bezier(.32,.58,.28,1);
  }
  .cb-cover{
    position:absolute; inset:0; border-radius:6px 14px 14px 6px; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    padding:28px 24px; color:#f3e9cd;
    background:
      radial-gradient(90% 55% at 50% 30%, rgba(61,99,165,.55), transparent 65%),
      repeating-linear-gradient(115deg, rgba(233,209,147,.03) 0 2px, transparent 2px 7px),
      linear-gradient(165deg, #1a3565 0%, var(--navy-800) 48%, #0a1c3a 100%);
    border:1px solid rgba(233,209,147,.4);
    box-shadow:14px 20px 44px rgba(0,0,0,.5);
    transform-origin:0% 50%; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    transition:transform 1.6s cubic-bezier(.35,.55,.25,1);
  }
  .cb-cover::before{
    content:""; position:absolute; top:0; bottom:0; left:0; width:16px;
    background:linear-gradient(to right, rgba(0,0,0,.38), rgba(233,209,147,.14) 55%, transparent);
  }
  .cb-frame{ position:absolute; inset:11px; border:1px solid rgba(233,209,147,.65); border-radius:4px 10px 10px 4px; pointer-events:none; }
  .cb-frame::after{ content:""; position:absolute; inset:4px; border:1px solid rgba(233,209,147,.3); border-radius:inherit; }
  .closed-book.opening .cb-cover{ transform:rotateY(-172deg); }
  .closed-book.opening .cb-leaf.l1{ transform:rotateY(-148deg); transition-delay:.14s; }
  .closed-book.opening .cb-leaf.l2{ transform:rotateY(-124deg); transition-delay:.26s; }
  .closed-book.opening .cb-leaf.l3{ transform:rotateY(-98deg); transition-delay:.38s; }
  .cb-hint{
    display:flex; align-items:center; gap:12px; margin:0;
    font-family:var(--serif); font-style:italic; font-size:1.3rem; color:var(--gold-light);
    transition:opacity .3s;
  }
  .closed-book.opening .cb-hint{ opacity:0; }
  .cb-pulse{ width:13px; height:13px; flex:none; border-radius:50%; background:var(--gold-light); animation:cbPulse 1.6s ease-out infinite; }
  @keyframes cbPulse{ 0%{ box-shadow:0 0 0 0 rgba(233,209,147,.5); } 70%{ box-shadow:0 0 0 17px rgba(233,209,147,0); } 100%{ box-shadow:0 0 0 0 rgba(233,209,147,0); } }

  @media (prefers-reduced-motion: reduce){
    .corner .fold{ animation:none; }
    .loader .bar i{ animation-duration:.2s; }
    .cb-pulse{ animation:none; }
    .cb-cover, .cb-leaf{ transition-duration:.25s; }
  }
</style>
</head>
<body>

<!-- reusable floral corner + ornaments -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="floral-g">
      <path d="M6 84 C4 50 10 22 34 6 C22 26 16 50 14 84 Z" fill="#5d84b8" opacity=".55"/>
      <path d="M84 6 C50 4 22 10 6 34 C26 22 50 16 84 14 Z" fill="#5d84b8" opacity=".55"/>
      <g fill="#8fb0dd">
        <circle cx="26" cy="26" r="10"/><circle cx="40" cy="18" r="7"/><circle cx="18" cy="40" r="7"/>

      '<div class="curl"></div>';

  }
  function renderIdle(){
    faceFront.innerHTML = faceHTML(pages[current].html, false);
    faceBack.innerHTML = faceHTML(pages[Math.min(current + 1, N - 1)].html, true);

  function setAngle(a){
    angle = a;
    var p = Math.min(1, Math.max(0, -a / 180));           // 0 front -> 1 back
    var bend = Math.sin(p * Math.PI);                      // peaks mid-turn: the "curl"
    // The sheet rotates ONLY around the spine (its left edge, transform-origin 0% 50%):
    // no sideways translation, so the spine stays pinned exactly like a real leaf
    // while the free right edge describes a semicircle over to the left side.
    sheet.style.transform =
      'rotateY(' + a + 'deg)' +
      ' rotateX(' + (bend * 1.4) + 'deg)';
    if (shadeF) shadeF.style.opacity = (p < 0.5 ? p * 1.25 : (1 - p) * 0.35).toFixed(3);
    if (shadeB) shadeB.style.opacity = (p > 0.5 ? (1 - p) * 1.25 : p * 0.3).toFixed(3);
    if (curlF){ curlF.style.opacity = (bend * 0.9).toFixed(3); curlF.style.backgroundPosition = ((110 - p * 130)) + '% 0'; }
    if (curlB){ curlB.style.opacity = (bend * 0.9).toFixed(3); curlB.style.backgroundPosition = ((p * 130 - 20)) + '% 0'; }
    var veil = pageUnder.querySelector('.veil');
    if (veil) veil.style.opacity = (bend * 0.22).toFixed(3);
    // Shadow cast on the page underneath: it hugs the turning sheet, so its width
    // follows the sheet's projected width (full at rest, a thin band at the spine
    // when the sheet stands upright) and it softens as the sheet rises.
    var proj = Math.abs(Math.cos(p * Math.PI));
    sheetShadow.style.opacity = (bend * 0.8).toFixed(3);
    sheetShadow.style.transform = 'scaleX(' + Math.max(0.06, proj).toFixed(3) + ')';
  }
  function animateAngle(from, to, dur, done){
    if (reduced) dur = Math.min(dur, 60);
    var t0 = null;
    animating = true;
    function step(ts){
      if (!t0) t0 = ts;
      var t = Math.min(1, (ts - t0) / dur);
      var e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;  // easeInOutCubic
      setAngle(from + (to - from) * e);
      if (t < 1) requestAnimationFrame(step);
      else { animating = false; if (done) done(); }
    }
    requestAnimationFrame(step);
  }
  function syncUI(){
    pageNum.textContent = current === 0 ? 'Portada' : (pages[current].name + ' · ' + (current + 1) + ' de ' + N);
    progressBar.style.width = ((current / (N - 1)) * 100) + '%';
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === N - 1;
    cornerR.classList.toggle('show', current < N - 1 && !animating);
    cornerL.classList.toggle('show', current > 0 && !animating);
  }

  function goNext(){
    if (animating || current >= N - 1) return;
    cornerR.classList.remove('show'); cornerL.classList.remove('show');
    faceFront.innerHTML = faceHTML(pages[current].html, false);
    faceBack.innerHTML = faceHTML(pages[current + 1].html, true);
    // With the spine hinge, the sheet lifts off the stack and the page revealed
    // underneath must be the next one — the same one that stays when it lands.
    setUnder(current + 1);
    grabOverlays(); setAngle(0);
    animateAngle(0, -180, 1020, function(){
      current++;
      renderIdle();
      if (current === N - 1) showToast('Llegaste al final del libro');
    });
  }
  function goPrev(){
    if (animating || current <= 0) return;
    cornerR.classList.remove('show'); cornerL.classList.remove('show');
    // Sheet starts turned (showing current page on its back) and un-turns to reveal the previous page on its front.
    faceFront.innerHTML = faceHTML(pages[current - 1].html, false);
    faceBack.innerHTML = faceHTML(pages[current].html, true);
    setUnder(current - 1);
    grabOverlays(); setAngle(-180);
    animateAngle(-180, 0, 1020, function(){
      current--;
      renderIdle();
    });
  }
  function goHome(){
    if (animating || current === 0) return;
    cornerR.classList.remove('show'); cornerL.classList.remove('show');
    // Same reverse sheet turn as goPrev — the sheet un-turns from the left,
    // hinged on the spine, until the first page lies flat again.
    faceFront.innerHTML = faceHTML(pages[0].html, false);
    faceBack.innerHTML = faceHTML(pages[current].html, true);
    setUnder(0);
    grabOverlays(); setAngle(-180);
    animateAngle(-180, 0, 1150, function(){
      current = 0;
      renderIdle();
      showToast('De vuelta al inicio del libro');
    });
  }
  nextBtn.addEventListener('click', goNext);
  prevBtn.addEventListener('click', goPrev);
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight') goNext();
    if (e.key === 'ArrowLeft') goPrev();
  });

  /* ----- Drag / swipe / corner tap: finger drives the sheet angle ----- */
  var drag = null;
  stage.addEventListener('pointerdown', function(e){
    if (animating) return;
    if (e.target.closest('a,button')) return;
    var r = stage.getBoundingClientRect();
    drag = { startX: e.clientX, startY: e.clientY, x: e.clientX, mode: null, r: r };
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', function(e){
    if (!drag) return;
    drag.x = e.clientX;
    var dx = e.clientX - drag.startX;
    var dy = e.clientY - drag.startY;
    if (!drag.mode){
      if (Math.abs(dx) < 14 || Math.abs(dy) > Math.abs(dx)) return;
      if (dx < 0 && current < N - 1){
        drag.mode = 'next';
        // The sheet's free edge starts at the right side of the book; the finger
        // drags that edge, wherever it grabbed the page, along its real arc.
        drag.edgeOffset = (drag.r.left + drag.r.width) - drag.startX;
        faceFront.innerHTML = faceHTML(pages[current].html, false);
        faceBack.innerHTML = faceHTML(pages[current + 1].html, true);
        setUnder(current + 1);
        grabOverlays();
        cornerR.classList.remove('show'); cornerL.classList.remove('show');
        animating = true;
      } else if (dx > 0 && current > 0){
        drag.mode = 'prev';
        // Coming back, the free edge starts flipped over on the LEFT of the spine.
        drag.edgeOffset = (drag.r.left - drag.r.width) - drag.startX;
        faceFront.innerHTML = faceHTML(pages[current - 1].html, false);
        faceBack.innerHTML = faceHTML(pages[current].html, true);
        setUnder(current - 1);
        grabOverlays();
        cornerR.classList.remove('show'); cornerL.classList.remove('show');
        animating = true;
        setAngle(-180);
      } else { drag = null; return; }
    }
    // Real circular motion around the spine (left edge): the free edge sits at
    // x = spine + width·cos(angle), so the angle follows the finger through
    // arccos — slow near both flat positions, fastest as it crosses the spine.
    var edgeX = e.clientX + (drag.edgeOffset || 0);
    var ratio = (edgeX - drag.r.left) / drag.r.width;
    ratio = Math.min(1, Math.max(-1, ratio));
    setAngle(-Math.acos(ratio) * 180 / Math.PI);
  });
  function endDrag(e){
    if (!drag) return;
    var d = drag; drag = null;
    var dx = (e.clientX || d.x) - d.startX;
    if (!d.mode){
      // Simple tap: corners / edges turn the page, centre does nothing.
      var r = d.r, rx = (e.clientX - r.left) / r.width, ry = (e.clientY - r.top) / r.height;
      if (rx > 0.68 && ry > 0.55) goNext();
      else if (rx < 0.32 && ry > 0.55) goPrev();
      else if (rx > 0.86) goNext();
      else if (rx < 0.14) goPrev();
      return;
    }
    animating = false;
    // Settle time grows with the angle left to travel, so a short flick back
    // is quick and a nearly completed turn falls over at a natural pace.
    function settle(to, done){
      var dist = Math.abs(to - angle);
      animateAngle(angle, to, Math.round(150 + 640 * dist / 180), done);
    }
    if (d.mode === 'next'){
      if (angle < -62) settle(-180, function(){ current++; renderIdle(); });
      else settle(0, renderIdle);
    } else {
      if (angle > -118) settle(0, function(){ current--; renderIdle(); });
      else settle(-180, renderIdle);
    }
  }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', function(){ if (drag && drag.mode){ animating = false; renderIdle(); } drag = null; });

  /* Buttons inside pages (e.g. add to calendar) */
  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-action="ics"]');
    if (b) downloadICS();
    var h = e.target.closest('[data-action="home"]');
    if (h) goHome();
  });
  function downloadICS(){
    var ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Invitacion Ximena//XV//ES','BEGIN:VEVENT',
      'UID:xv-ximena-20261219@invitacion','DTSTAMP:20261125T120000Z',
      'DTSTART:20261219T190000Z','DTEND:20261220T003000Z',
      'SUMMARY:XV Años de Ximena',
      'DESCRIPTION:Misa 1:00 pm en Parroquia Luteranense de San Pedro Apóstol. Recepción 3:00 pm en Salón de Eventos del Hotel Pozo Viejo.',
      'LOCATION:Parroquia Luteranense de San Pedro Apóstol','END:VEVENT','END:VCALENDAR'].join('\r\n');
    var url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
    var a = document.createElement('a');
    a.href = url; a.download = 'XV-Ximena-19-diciembre.ics';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    showToast('Evento descargado para tu calendario');
  }

  /* ================= Countdown ================= */
  var target = new Date('2026-12-19T13:00:00-06:00').getTime();
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function tick(){
    var diff = target - Date.now();
    var vals;
    if (diff <= 0) vals = { d: 0, h: 0, m: 0, s: 0 };
    else vals = {
      d: Math.floor(diff / 86400000),
      h: Math.floor(diff / 3600000) % 24,
      m: Math.floor(diff / 60000) % 60,
      s: Math.floor(diff / 1000) % 60
    };
    var nums = document.querySelectorAll('[data-cd]');
    for (var i = 0; i < nums.length; i++){
      var k = nums[i].getAttribute('data-cd');
      nums[i].textContent = k === 'd' ? vals.d : pad(vals[k]);
    }
  }
  setInterval(tick, 1000);

  /* ================= Music: "Mr. Blue Sky" (real audio file, looped) ================= */
  var musicBtn = document.getElementById('musicBtn');
  var bgMusic = document.getElementById('bgMusic');
  var musicOn = false;
  function startMusic(){
    if (musicOn) return;
    musicOn = true; musicBtn.classList.add('playing');
    var pr = bgMusic.play();
    if (pr && pr.catch) pr.catch(function(){
      musicOn = false; musicBtn.classList.remove('playing');
      showToast('No se pudo reproducir la música');
    });
  }
  function stopMusic(){
    bgMusic.pause();
    musicOn = false; musicBtn.classList.remove('playing');
  }
  musicBtn.addEventListener('click', function(){
    if (!musicOn){ startMusic(); showToast('Sonando: Mr. Blue Sky'); }
    else stopMusic();
  });

  /* ===== Closed book: the "Toca para abrir" tap unlocks the audio, so
     Mr. Blue Sky starts the moment the book begins to open ===== */
  var closedBook = document.getElementById('closedBook');
  var bookOpened = false;
  function openBook(){
    if (bookOpened) return;
    bookOpened = true;
    startMusic();
    closedBook.classList.add('opening');
    setTimeout(function(){ closedBook.classList.add('gone'); }, 1750);
    setTimeout(function(){ closedBook.style.display = 'none'; }, 2500);
  }
  closedBook.addEventListener('click', openBook);
  closedBook.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openBook(); }
  });

  /* ================= Toast + loader ================= */
  var toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2600);
  }

  renderIdle();
  tick();
  setTimeout(function(){
    document.getElementById('loader').classList.add('done');
  }, 1500);
})();
</script>
